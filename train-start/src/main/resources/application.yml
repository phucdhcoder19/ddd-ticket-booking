server:
  port: 9999
  tomcat:
    # LESSON 27 — thread count by Brian Goetz's formula:
    #   N = Ncpu x Ucpu x (1 + W/C)
    #     Ncpu = 12 cores
    #     Ucpu = 0.8  (target CPU utilisation)
    #     W/C  = ~4.7 (a request waits on Redis+MySQL ~7ms, computes ~1.5ms)
    #   -> 12 x 0.8 x 5.7 ~= 55, rounded to 50
    #
    # MIND THE KEY: Spring Boot 2.3 dropped "server.tomcat.max-threads".
    # Using the old key makes Spring IGNORE IT SILENTLY, no error, no warning,
    # and Tomcat runs the default 200 threads.
    threads:
      max: 50
      # Keep as many as cores ready -> a traffic spike does not wait for thread creation
      min-spare: 12
    # When threads run out, requests queue HERE, where we can measure and reject them.
    # Beyond 200, reject right away instead of piling up on MySQL.
    accept-count: 200
    # Enable Tomcat MBeans -> the tomcat.threads.config.max metric PROVES
    # the config actually took effect, instead of trusting the yml file.
    mbeanregistry:
      enabled: true
spring:
  application:
    name: train-ticket-booking
  # TIME ZONE NOTE: the MySQL container runs in UTC, the host machine in +07.
  # With serverTimezone=UTC the driver reads "08:00 in the DB is 08:00 UTC" and
  # converts it to local time -> the API returns 15:00. datetime columns carry
  # no zone, so the application's zone must be declared for reads and writes to match.
  # Getting this wrong shifts the hold expiry job (lesson 18) by 7 hours.
  datasource:
    url: jdbc:mysql://localhost:3316/train_ticket?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: root1234
    hikari:
      # The CONNECTION POOL formula differs from the thread formula:
      #   connections = (cores x 2) + disks = (12 x 2) + 1 = 25 -> use 20
      #
      # Fewer than threads is CORRECT: each request holds a connection ~5ms
      # out of a ~15ms lifetime. A pool bigger than MySQL can handle only makes
      # every query slower and pushes the queue down into the DB — where we have no control.
      maximum-pool-size: 20
      # Equal to maximum-pool-size -> fixed pool, no resizing.
      # A resizing pool adds latency right at peak time: new connections cost 50-100ms.
      minimum-idle: 20
      # Wait at most 3s, then fail instead of hanging forever
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: update # creates tables from @Entity — for learning only
    show-sql: true # ON, this lesson needs to see the SQL to tell whether the cache works
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6319
      lettuce:
        pool:
          max-active: 50
app:
  pricing:
    # Lunar New Year peak dates — published by the railway in an official notice,
    # not derived from the lunar calendar. Outside this range the factor is 1.0
    peak-from: "2027-01-25"
    peak-to: "2027-02-05"
    peak-surcharge: 1.35
  hold:
    # How long a hold lasts. Set to 30s to watch the job run without waiting.
    duration: 10m
    # Max holds released per scan -> short transactions, no long locks
    release-batch: 200
    # How often the job scans, in ms
    scan-interval-ms: 10000
  queue:
    # false = open door, everyone gets in immediately and POST /holds needs no admission.
    # Turn off when JMeter fires straight at /holds.
    enabled: true
    # Max number of PEOPLE inside (picking seats, paying) at the same time.
    # Local test: set 2 and open 3 tabs -> the third tab must wait.
    capacity: 500
    # How often the admit job runs (ms), and how many people it admits per run at most
    admit-interval-ms: 1000
    max-admit-per-tick: 50
    # Once admitted, how long there is to buy; after that the slot is lost and freed
    admission-window: 15m
    # Estimated time a person spends inside — only used to show "about X minutes left"
    estimated-session-seconds: 180
  sale:
    # Sale label — display text, not business data
    label: "Sale 1 — Lunar New Year 2027 tickets"
  web:
    # Origin of train-web. Vite switches ports when 5173 is busy -> [*] for any localhost port.
    # In production replace it with the real domain, do NOT keep [*].
    allowed-origin-pattern: "http://localhost:[*]"
  demo:
    # Lesson 21: set to true to fail on purpose AFTER deducting MySQL stock
    # -> proves the transaction ROLLS BACK (stock back to its old value, no order)
    fail-after-deduct: false

resilience4j:
  circuitbreaker:
    instances:
      checkRandom:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        #        slidingWindowType: TIME_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  ratelimiter:
    instances:
      backendA:
        limitForPeriod: 2
        limitRefreshPeriod: 10s
        timeoutDuration: 0
        registerHealthIndicator: true
        eventConsumerBufferSize: 100
      backendB:
        limitForPeriod: 6
        limitRefreshPeriod: 500ms
        timeoutDuration: 3s
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - "*"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # Tag EVERY metric with the application name -> Grafana can filter by app
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}

# Latency measurement for HTTP
management.metrics.distribution:
  # Enable histograms -> p50/p95/p99 can be computed in Grafana
  percentiles-histogram:
    http.server.requests: true
  percentiles:
    http.server.requests: 0.5, 0.95, 0.99
  # SLO buckets: what % of requests finish under 100ms / 500ms / 1s / 2s
  slo:
    http.server.requests: 100ms, 500ms, 1s, 2s
