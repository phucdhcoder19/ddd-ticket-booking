server:
  port: 9999
  tomcat:
    max-threads: 10
spring:
  application:
    name: train-ticket-booking
  # LUU Y MUI GIO: container MySQL chay gio UTC, may that chay +07.
  # De serverTimezone=UTC thi driver hieu "08:00 trong DB la 08:00 UTC" roi doi
  # sang gio may -> API tra ve 15:00. Cot datetime khong mang mui gio, nen phai
  # khai dung mui cua ung dung thi doc/ghi moi doi xung.
  # Sai cho nay se lam job quet don het han (bai 18) lech 7 tieng.
  datasource:
    url: jdbc:mysql://localhost:3316/train_ticket?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: root1234
    hikari:
      maximum-pool-size: 50
  jpa:
    hibernate:
      ddl-auto: update # tự tạo bảng từ @Entity — chỉ dùng khi học
    show-sql: true # BẬT lên, bài này cần nhìn SQL để biết cache có ăn không
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6319
      lettuce:
        pool:
          max-active: 50
app:
  sale:
    # Ten dot mo ban — chu hien thi, khong phai du lieu nghiep vu
    label: "Đợt 1 — vé Tết Đinh Mùi 2027"
  web:
    # Origin cua train-web. Vite nhay cong khi 5173 ban -> dung [*] cho moi cong localhost.
    # Len that thi thay bang domain cu the, KHONG de [*].
    allowed-origin-pattern: "http://localhost:[*]"
  demo:
    # Bai 21: doi thanh true de co tinh gay loi SAU khi tru kho MySQL
    # -> kiem chung transaction ROLLBACK (kho quay ve so cu, khong co don)
    fail-after-deduct: false

resilience4j:
  circuitbreaker:
    instances:
      checkRandom:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        #        slidingWindowType: TIME_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  ratelimiter:
    instances:
      backendA:
        limitForPeriod: 2
        limitRefreshPeriod: 10s
        timeoutDuration: 0
        registerHealthIndicator: true
        eventConsumerBufferSize: 100
      backendB:
        limitForPeriod: 6
        limitRefreshPeriod: 500ms
        timeoutDuration: 3s
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - "*"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # Gan nhan application vao MOI metric -> Grafana loc duoc theo app
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}

# Cau hinh do do tre (latency) cho HTTP
management.metrics.distribution:
  # Bat histogram -> tinh duoc p50/p95/p99 trong Grafana
  percentiles-histogram:
    http.server.requests: true
  percentiles:
    http.server.requests: 0.5, 0.95, 0.99
  # Cac moc SLO: bao nhieu % request duoi 100ms / 500ms / 1s / 2s
  slo:
    http.server.requests: 100ms, 500ms, 1s, 2s
