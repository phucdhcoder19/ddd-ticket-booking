server:
  port: 9999
  tomcat:
    # BAI 27 — so thread theo cong thuc Brian Goetz:
    #   N = Ncpu x Ucpu x (1 + W/C)
    #     Ncpu = 12 core
    #     Ucpu = 0.8  (muc CPU muon dung)
    #     W/C  = ~4.7 (mot request cho Redis+MySQL ~7ms, tinh toan ~1.5ms)
    #   -> 12 x 0.8 x 5.7 ~= 55, lam tron 50
    #
    # CHU Y KEY: Spring Boot 2.3 da bo "server.tomcat.max-threads".
    # Viet key cu thi Spring BO QUA LANG LE, khong loi khong canh bao,
    # va Tomcat chay 200 thread mac dinh.
    threads:
      max: 50
      # Giu san bang so core -> traffic dot bien khong phai doi tao thread
      min-spare: 12
    # Het thread thi xep hang o DAY, noi minh do duoc va tu choi duoc.
    # Vuot 200 thi tu choi luon, khong de don xuong MySQL.
    accept-count: 200
    # Bat MBean cua Tomcat -> co metric tomcat.threads.config.max de KIEM CHUNG
    # cau hinh da an that su hay chua, thay vi tin vao file yml.
    mbeanregistry:
      enabled: true
spring:
  application:
    name: train-ticket-booking
  # LUU Y MUI GIO: container MySQL chay gio UTC, may that chay +07.
  # De serverTimezone=UTC thi driver hieu "08:00 trong DB la 08:00 UTC" roi doi
  # sang gio may -> API tra ve 15:00. Cot datetime khong mang mui gio, nen phai
  # khai dung mui cua ung dung thi doc/ghi moi doi xung.
  # Sai cho nay se lam job quet don het han (bai 18) lech 7 tieng.
  datasource:
    url: jdbc:mysql://localhost:3316/train_ticket?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: root1234
    hikari:
      # Cong thuc cho HO KET NOI KHAC voi cong thuc thread:
      #   connections = (so core x 2) + so dia = (12 x 2) + 1 = 25 -> lay 20
      #
      # Nho hon so thread la DUNG: moi request chi cam connection ~5ms
      # trong vong doi ~15ms. Ho to hon suc MySQL chi lam moi query cham
      # hon, va day hang doi xuong DB — noi minh khong kiem soat duoc.
      maximum-pool-size: 20
      # Bang maximum-pool-size -> ho co dinh, khong co gian.
      # Ho co gian gay tre dung luc cao diem: phai mo connection moi (50-100ms).
      minimum-idle: 20
      # Cho toi da 3s roi bao loi, khong treo vo han
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: update # tự tạo bảng từ @Entity — chỉ dùng khi học
    show-sql: true # BẬT lên, bài này cần nhìn SQL để biết cache có ăn không
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6319
      lettuce:
        pool:
          max-active: 50
app:
  hold:
    # Giu cho bao lau. Doi thanh 30s de xem job chay ma khong phai ngoi doi.
    duration: 10m
    # Moi luot quet don toi da bao nhieu -> transaction ngan, khong khoa lau
    release-batch: 200
    # Job quet moi bao nhieu ms
    scan-interval-ms: 10000
  sale:
    # Ten dot mo ban — chu hien thi, khong phai du lieu nghiep vu
    label: "Đợt 1 — vé Tết Đinh Mùi 2027"
  web:
    # Origin cua train-web. Vite nhay cong khi 5173 ban -> dung [*] cho moi cong localhost.
    # Len that thi thay bang domain cu the, KHONG de [*].
    allowed-origin-pattern: "http://localhost:[*]"
  demo:
    # Bai 21: doi thanh true de co tinh gay loi SAU khi tru kho MySQL
    # -> kiem chung transaction ROLLBACK (kho quay ve so cu, khong co don)
    fail-after-deduct: false

resilience4j:
  circuitbreaker:
    instances:
      checkRandom:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        #        slidingWindowType: TIME_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  ratelimiter:
    instances:
      backendA:
        limitForPeriod: 2
        limitRefreshPeriod: 10s
        timeoutDuration: 0
        registerHealthIndicator: true
        eventConsumerBufferSize: 100
      backendB:
        limitForPeriod: 6
        limitRefreshPeriod: 500ms
        timeoutDuration: 3s
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - "*"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # Gan nhan application vao MOI metric -> Grafana loc duoc theo app
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}

# Cau hinh do do tre (latency) cho HTTP
management.metrics.distribution:
  # Bat histogram -> tinh duoc p50/p95/p99 trong Grafana
  percentiles-histogram:
    http.server.requests: true
  percentiles:
    http.server.requests: 0.5, 0.95, 0.99
  # Cac moc SLO: bao nhieu % request duoi 100ms / 500ms / 1s / 2s
  slo:
    http.server.requests: 100ms, 500ms, 1s, 2s
